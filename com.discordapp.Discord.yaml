id: com.discordapp.Discord
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: com.discordapp.Discord
separate-locales: false
tags:
  - proprietary

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=x11
  - --socket=pcsc
  - --socket=pulseaudio
  - --share=network
  - --device=all
  - --filesystem=xdg-run/pipewire-0
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar
  - --talk-name=com.canonical.indicator.application
  - --talk-name=com.canonical.Unity
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --env=ELECTRON_TRASH=gio

modules:
  - name: socat
    config-opts:
      - --disable-largefile
      - --disable-stats
      - --disable-stdio
      - --disable-fdnum
      - --disable-creat
      - --disable-gopen
      - --disable-pipe
      - --disable-socketpair
      - --disable-termios
      - --disable-abstract-unixsocket
      - --disable-ip6
      - --disable-rawip
      - --disable-genericsocket
      - --disable-interface
      - --disable-tcp
      - --disable-udp
      - --disable-udplite
      - --disable-sctp
      - --disable-dccp
      - --disable-vsock
      - --disable-namespaces
      - --disable-posixmq
      - --disable-socks4
      - --disable-socks4a
      - --disable-socks5
      - --disable-proxy
      - --disable-exec
      - --disable-system
      - --disable-shell
      - --disable-pty
      - --disable-fs
      - --disable-readline
      - --disable-openssl
      - --disable-tun
      - --disable-sycls
      - --disable-filan
      - --disable-libwrap
      - --disable-resolve
    sources:
      - type: archive
        url: http://www.dest-unreach.org/socat/download/socat-1.8.1.3.tar.gz
        sha256: 06602ffd591e98c75b3dc1d66f0f19136cc666b0b2d95caad987d6ab2cb28097
        x-checker-data:
          type: anitya
          project-id: 4848
          url-template: http://www.dest-unreach.org/socat/download/socat-$version.tar.gz
    cleanup:
      - /bin/*.sh
      - /bin/filan
      - /bin/procan
      - /share/man

  - name: go-asar
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin
    build-commands:
      - go build -o /app/bin/go-asar ./cmd/asar
    sources:
      - type: archive
        url: https://github.com/dcboy/go-asar/archive/refs/tags/v0.1.0.tar.gz
        sha256: a4a5e8459526f78c78b4b1d98a44ffca3de99a1e34d8176afc94507af3efdf3b
        x-checker-data:
          type: anitya
          project-id: 393089
          url-template: https://github.com/dcboy/go-asar/archive/refs/tags/v$version.tar.gz
    cleanup:
      - '*'

  - name: discord
    buildsystem: simple
    build-options:
      # Some Discord binary modules ship with debug symbols, make sure not to touch them.
      no-debuginfo: true
      strip: false
    build-commands:
      - mkdir -p /app/discord/modules
      # Extract the main Discord application
      - brotli -cd discord.tar.br | tar xf - -C /app/discord --strip-components 1
      # Extract Discord modules
      - |
        set -euo pipefail
        for module in *_module.tar.br; do
          target_dir=/app/discord/modules/${module%_*}
          mkdir -p $target_dir
          brotli -cdv -- $module | tar -xf - -C $target_dir --strip-components 1
        done
      - install -Dm755 discord.sh /app/bin/com.discordapp.Discord
      - install -Dm755 disable-breaking-updates.py /app/bin
      - install -Dm644 Discord/discord.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 com.discordapp.Discord.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm644 com.discordapp.Discord.appdata.xml /app/share/appdata/com.discordapp.Discord.appdata.xml
    post-install:
      # HACK: Krisp fails to initialize if this directory is not present (or if can't be created). Logs:
      #       MediaEngineStore] Failed to load Krisp module: Failed to setup Krisp module, error code: -4
      #       [AVError] AV error reported: noise-canceller-error {"underlyingError":"NoiseCancellerError.KRISP_INIT_ERROR_GLOBAL_INIT"}
      - mkdir -p /app/discord/modules/discord_krisp/KMS/logs
      # HACK: Set the newUpdater key to false in build_info.json in order to disable the new Discord updater (released on 2026-05-04, version 1.0.136),
      #       Also add a localModulesRoot key that points to the Discord modules we're packaging.
      - |
        set -e
        jq '.newUpdater = false | .localModulesRoot = "/app/discord/modules"' /app/discord/resources/build_info.json > tmp.json
        mv tmp.json /app/discord/resources/build_info.json
      # HACK: MediaPipe (video backgrounds / selfie segmentation) opens discord_voice *.tflite
      #       models with O_RDWR. /app is mounted read-only, so the open fails with EACCES and the
      #       camera goes black (see https://github.com/flathub/com.discordapp.Discord/issues/650).
      #       Flatpak cannot ship files into the per-user writable tree at build time (/var/data is
      #       created empty at runtime), so stash the real models under /app and replace them in the
      #       module dir with symlinks to /var/data/mediapipe_models; discord.sh copies the stash
      #       there on launch. Globbing *.tflite picks up any models Discord adds later.
      - |
        set -eu
        voice=/app/discord/modules/discord_voice
        store=/app/discord/mediapipe_models
        # /var/data is Flatpak's alias for $XDG_DATA_HOME; keep an absolute path in the symlink.
        writable=/var/data/mediapipe_models
        mkdir -p "${store}"
        for model in "${voice}"/*.tflite; do
          name=${model##*/}
          mv -f "${model}" "${store}/${name}"
          ln -sfn "${writable}/${name}" "${voice}/${name}"
        done
      # HACK: Discord version 1.0.0.147 (released on 2026-07-14) began calling Electron's app.setDesktopName() API to set the desktop file.
      #       The problem is that it uses "discord" as the desktop filename, while this Flatpak package uses "com.discordapp.Discord".
      #       This mismatch causes window association issues and ends up breaking Discord's unread messages badge.
      #       The ideal fix would be for Discord developers to remove the API call, set the "desktopFile" property in "package.json",
      #       and let Electron take care of the rest. Until that happens, though, we're removing the API call ourselves.
      - go-asar extract /app/discord/resources/app.asar /app/app-asar-unpacked
      - grep -Pq '\bapp\.setDesktopName\?\.\(packageName\)' /app/app-asar-unpacked/bundle.js
      - sed -ri 's/\bapp\.setDesktopName\?\.\(packageName\)//' /app/app-asar-unpacked/bundle.js
      - go-asar pack /app/app-asar-unpacked /app/discord/resources/app.asar
      - rm -rf /app/app-asar-unpacked
      # HACK: Patch Discord's app.asar to fix the desktop filename to avoid window association issues, as recommended by the Flatpak documentation:
      #       https://docs.flatpak.org/en/latest/electron.html#using-correct-desktop-file-name
      - patch-electron-desktop-filename /app/discord/resources/app.asar
      - desktop-file-edit --add-mime-type=x-scheme-handler/discord /app/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --set-key=Exec --set-value='com.discordapp.Discord %U' /app/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --set-key=Icon --set-value=com.discordapp.Discord /app/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --remove-key=Path /app/share/applications/${FLATPAK_ID}.desktop
    sources:
      - type: archive
        dest-filename: discord.tar.gz
        strip-components: 0
        url: https://dl.discordapp.net/apps/linux/1.0.170/discord-1.0.170.tar.gz
        sha256: 129f38c16e7071b25c14c86f6cec43826370ed114d6bc77f9f406e1d70660c8c
        x-checker-data:
          is-main-source: true
          type: json
          url: https://discord.com/api/updates/stable?platform=linux
          version-query: .name
